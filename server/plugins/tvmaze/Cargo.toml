[package]
name = "dionysus_plugin_tvmaze"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
dionysus_metadata_sdk = { path = "../../crates/dionysus_metadata_sdk", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = { version = "0.1.44", features = ["async-await"] }
