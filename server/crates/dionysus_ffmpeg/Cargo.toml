[package]
name = "dionysus_ffmpeg"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
dionysus_ffprobe = { version = "0.1.0", path = "../dionysus_ffprobe" }
dionysus_proto = { version = "0.1.0", path = "../dionysus_proto" }
prost = "0.14.4"
prost-types = "0.14.4"
rust_ffmpeg = "1.0.0"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tonic = "0.14.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
