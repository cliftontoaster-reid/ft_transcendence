[package]
name = "dionysus_user"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = { version = "2.3.13", features = ["postgres"] }
dionysus_db = { version = "0.1.0", path = "../dionysus_db" }
dionysus_proto = { version = "0.1.0", path = "../dionysus_proto" }
tokio = { version = "1", features = ["full"] }
tonic = "0.14.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1.26.1"
