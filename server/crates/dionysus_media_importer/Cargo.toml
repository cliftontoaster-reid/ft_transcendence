[package]
name = "dionysus_media_importer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dionysus-importer"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
diesel = { version = "2.3.14", features = ["postgres"] }
dionysus_db = { version = "0.1.0", path = "../dionysus_db" }
dionysus_ffprobe = { version = "0.1.0", path = "../dionysus_ffprobe" }
dionysus_metadata = { version = "0.1.0", path = "../dionysus_metadata" }
dionysus_metadata_providers = { version = "0.1.0", path = "../dionysus_metadata_providers" }
dionysus_metadata_wasm = { version = "0.1.0", path = "../dionysus_metadata_wasm" }
dionysus_proto = { version = "0.1.0", path = "../dionysus_proto" }
regex = "1.13.1"
rocket = { version = "0.5.2", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tonic = "0.14.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
