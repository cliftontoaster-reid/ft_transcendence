[package]
name = "dionysus_db"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.41"
diesel = { version = "2.3.13", features = ["chrono", "extras", "postgres", "uuid"] }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
dotenvy = "0.15.7"
pgvector = { version = "0.4.2", features = ["diesel"] }
uuid = "1.26.1"
