[package]
name = "dionysus_oidc"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2.3.14", features = ["chrono", "postgres", "uuid"] }
dionysus_db = { version = "0.1.0", path = "../dionysus_db" }
jsonwebtoken = "9"
openidconnect = "4"
redis = { version = "1.8", features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
rocket = { version = "0.5.2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros"] }
toml = "1.2.1"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
