[package]
name = "dionysus_oidc"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chrono = "0.4"
diesel = { version = "2.3.13", features = ["chrono", "postgres"] }
dionysus_db = { path = "../dionysus_db", version = "0.1.0" }
jsonwebtoken = "9"
openidconnect = "4"
redis = { version = "1.8", features = ["tokio-comp"] }
reqwest = {
  version = "0.12",
  default-features = false,
  features = [
    "json",
    "rustls-tls",
  ]
}
rocket = { version = "0.5.2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full", "macros", "rt"] }
toml = "1.2.1"
tracing = { version = "0.1.44", features = ["async-await"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
