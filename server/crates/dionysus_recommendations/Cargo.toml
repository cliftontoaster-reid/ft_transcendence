[package]
name = "dionysus_recommendations"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
diesel = { version = "2.3.14", features = ["postgres"] }
dionysus_db = { version = "0.1.0", path = "../dionysus_db" }
dionysus_proto = { version = "0.1.0", path = "../dionysus_proto" }
tokio = { version = "1.54.1", features = ["full"] }
tonic = "0.14.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.29.3"
