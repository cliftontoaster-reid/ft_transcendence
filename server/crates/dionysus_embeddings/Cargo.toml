[package]
name = "dionysus_embeddings"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
