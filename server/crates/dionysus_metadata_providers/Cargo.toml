[package]
name = "dionysus_metadata_providers"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
dionysus_metadata = { version = "0.1.0", path = "../dionysus_metadata" }
dionysus_metadata_model = { version = "0.1.0", path = "../dionysus_metadata_model" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "io-util"] }
