[package]
name = "dionysus_chat"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.54.1", features = ["full", "tracing"] }
tokio-tungstenite = "0.30.0"
tracing = { version = "0.1.44", features = ["async-await"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
prost = "0.14.4"
uuid = { version = "1", features = ["v4"] }
dionysus_proto = { version = "0.1.0", path = "../dionysus_proto" }