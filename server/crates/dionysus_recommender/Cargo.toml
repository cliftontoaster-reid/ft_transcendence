[package]
name = "dionysus_recommender"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
diesel = { version = "2.3.14", features = ["postgres"] }
dionysus_db = { version = "0.1.0", path = "../dionysus_db" }
dionysus_embeddings = { version = "0.1.0", path = "../dionysus_embeddings" }
pgvector = { version = "0.4.2", features = ["diesel"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.29.3"
