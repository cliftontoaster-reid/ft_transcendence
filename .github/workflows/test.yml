name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-svelte-unit:
    name: svelte unit (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: svelte
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Run vitest (client + server projects)
        run: bun run test:unit -- --run
        # vite.config.ts defines two vitest projects:
        #  - client: src/**/*.svelte.{test,spec}.{js,ts} (browser, playwright provider)
        #  - server: src/**/*.{test,spec}.{js,ts} (node)

  test-svelte-e2e:
    name: svelte e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: svelte
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Build and run Playwright tests
        run: bun run test:e2e
        # svelte/package.json:test:e2e -> playwright install && playwright test
        # now runs via bun: bunx playwright install + bunx playwright test
        # playwright.config.ts: webServer runs `bun run build && bun run preview` on port 4173
        # and testMatch is **/*.e2e.{ts,js}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            svelte/playwright-report/
            svelte/test-results/
          retention-days: 7

  test-rust:
    name: rust (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Cargo test (workspace)
        run: |
          # server/Cargo.toml is currently an empty workspace (resolver = "3") with no members
          # cargo test --all fails with "manifest is virtual, and the workspace has no members"
          # and --locked fails without Cargo.lock, so handle gracefully:
          if cargo metadata --format-version=1 --no-deps 2>/dev/null | grep -q '"packages":\s*\[\]'; then
            echo "No Rust crates in workspace - skipping cargo test"
            exit 0
          fi
          if [ -f Cargo.lock ]; then
            cargo test --locked --verbose
          else
            cargo test --verbose
          fi

      # Optional: keep cargo test running even if svelte fails -> no `needs` dependency
