syntax = "proto3";

package dionysus.user.v1;

import "dionysus/common/v1/asset.proto";

message UserID {
  dionysus.common.v1.UUID value = 1;
}

enum AgeBracket {
  AGE_BRACKET_UNSPECIFIED = 0;
  AGE_BRACKET_PEGI_3 = 1;
  AGE_BRACKET_PEGI_7 = 2;
  AGE_BRACKET_PEGI_12 = 3;
  AGE_BRACKET_PEGI_16 = 4;
  AGE_BRACKET_PEGI_18 = 5;
}

message Password{
  string actual_password = 1;
  string change_password = 2;
}

message User {
  UserID id = 1;
  string username = 2;
  string display_name = 3;
  string bio = 4;
  string avatar_url = 5;
  optional AgeBracket age = 6; 
    }

// PROFILE
message CreateProfileRequest {
  string username = 1;
  string display_name = 2;
  string bio = 3;
  string avatar_url = 4;
  optional AgeBracket age = 5;
}

message CreateProfileResponse {
  User user = 1;
}

message GetProfileRequest {
  UserID user_id = 1;
}

message GetProfileResponse {
  User user = 1;
}

message UpdateProfileRequest {
  optional string username = 1;
  optional string display_name = 2;
  optional string bio = 3;
  optional string avatar_url = 4;
  optional AgeBracket age = 5;
}

message UpdateProfileResponse {
  User user = 1;
}

message GetProfileByUsernameRequest {
  string username = 1;
}

message GetProfileByUsernameResponse {
  User user = 1;
}

message BatchGetProfilesRequest {
  // Maximum 100 identifiants, les doublons sont ignorés.
  repeated UserID user_ids = 1;
}

message BatchGetProfilesResponse {
  // Les utilisateurs introuvables sont simplement absents (pas d'erreur NOT_FOUND).
  repeated User users = 1;
}

message CheckUsernameAvailabilityRequest {
  string username = 1;
}

message CheckUsernameAvailabilityResponse {
  bool available = 1;
}

// FRIENDS
message GetFriendListRequest {
  UserID user_id = 1;
}

message GetFriendListResponse {
  repeated User friends = 1;
}

// SERVICES
service UserService {
  // Créer un profil
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  // Obtenir un profil
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  // Obtenir un profil à partir de son @username
  rpc GetProfileByUsername(GetProfileByUsernameRequest) returns (GetProfileByUsernameResponse);
  // Obtenir plusieurs profils en une requête (listes d'amis, chat, salons...)
  rpc BatchGetProfiles(BatchGetProfilesRequest) returns (BatchGetProfilesResponse);
  // Savoir si un username est libre (formulaire d'édition du profil)
  rpc CheckUsernameAvailability(CheckUsernameAvailabilityRequest) returns (CheckUsernameAvailabilityResponse);
  // Modifier un profil
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // Obtenir la liste d'amis
  rpc GetFriendList(GetFriendListRequest) returns (GetFriendListResponse);
}