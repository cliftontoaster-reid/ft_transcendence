syntax = "proto3";

package dionysus.user.v1;

import "dionysus/common/v1/asset.proto";

message UserID {
  uint64 value = 1;
}

enum AgeBracket {
  AGE_BRACKET_UNSPECIFIED = 0;
  AGE_BRACKET_PEGI_3 = 1;
  AGE_BRACKET_PEGI_7 = 2;
  AGE_BRACKET_PEGI_12 = 3;
  AGE_BRACKET_PEGI_16 = 4;
  AGE_BRACKET_PEGI_18 = 5;
}

message User {
  UserID id = 1;
  string username = 2;
  string display_name = 3;
  string bio = 4;
  optional dionysus.common.v1.Asset profile_picture = 5;
  optional AgeBracket age = 6;
}

// MESSAGES
message Message {
  uint64 id = 1;
  UserID sender_id = 2;
  UserID receiver_id = 3;
  string content = 4;
  int64 timestamp = 5;
}

// PROFILE
message CreateProfileRequest {
  string username = 1;
  string display_name = 2;
  string bio = 3;
  string avatar_url = 4;
  optional AgeBracket age = 5;
}

message CreateProfileResponse {
  User user = 1;
}

message GetProfileRequest {
  UserID user_id = 1;
}

message GetProfileResponse {
  User user = 1;
}

message UpdateProfileRequest {
  UserID user_id = 1;
  optional string username = 2;
  optional string display_name = 3;
  optional string bio = 4;
  optional string avatar_url = 5;
  optional AgeBracket age = 6;
}

message UpdateProfileResponse {
  User user = 1;
}

// FRIENDS
message GetFriendListRequest {
  UserID user_id = 1;
}

message GetFriendListResponse {
  repeated User friends = 1;
}

// SERVICES
service UserService {
  // Créer un profil
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  // Obtenir un profil
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  // Modifier un profil
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // Obtenir la liste d'amis
  rpc GetFriendList(GetFriendListRequest) returns (GetFriendListResponse);
}

