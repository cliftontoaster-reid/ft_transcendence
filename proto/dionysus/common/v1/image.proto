syntax = "proto3";

package dionysus.common.v1;

message ImageMetadata {
  enum ImageType {
    IMAGE_TYPE_UNSPECIFIED = 0;

    IMAGE_TYPE_POSTER = 1;
    IMAGE_TYPE_BACKDROP = 2;
    IMAGE_TYPE_STILL = 3;
    IMAGE_TYPE_THUMBNAIL = 4;
    IMAGE_TYPE_LOGO = 5;
    IMAGE_TYPE_PROMOTIONAL = 6;
    IMAGE_TYPE_BEHIND_THE_SCENES = 7;
    IMAGE_TYPE_CHARACTER = 8;
    IMAGE_TYPE_PERSON_PROFILE = 9;
    IMAGE_TYPE_COLLECTION_ARTWORK = 10;
  }

  ImageType type = 1;
  uint32 width = 2;
  uint32 height = 3;
  string mime_type = 4;
  bool is_primary = 5;
  int32 sort_order = 6;

  // Useful for localized posters or promotional material.
  string language_code = 7;
  string country_code = 8;
}
