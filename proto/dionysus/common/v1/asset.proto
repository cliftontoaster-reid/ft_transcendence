syntax = "proto3";

package dionysus.common.v1;

import "dionysus/common/v1/image.proto";

message Asset {
  enum AssetType {
    ASSET_TYPE_UNSPECIFIED = 0;

    ASSET_TYPE_IMAGE = 1;
    ASSET_TYPE_VIDEO = 2;
    ASSET_TYPE_AUDIO = 3;
    ASSET_TYPE_SUBTITLES = 4;

    ASSET_TYPE_OTHER = 5;
  }

  AssetType type = 1;
  string location = 2;
  bytes hash_sha256 = 3;

  oneof metadata {
    ImageMetadata image = 10;
  }
}

message UUID {
  bytes value = 1;
}
